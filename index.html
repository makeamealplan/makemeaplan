<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MakeMeAPlan — Legal</title>
<style>
  :root {
    --surface: #FDFBF7;
    --on-surface: #1C1C1E;
    --on-surface-2: #3A3A3C;
    --brand: #4A6B5D;
    --muted: #8A8A8E;
    --border: #E6E2D8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 32px; margin: 0 0 8px; letter-spacing: -0.5px; }
  .subtitle { color: var(--muted); margin-bottom: 40px; }
  .card {
    display: block;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--on-surface);
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--brand); }
  .card h2 { margin: 0 0 6px; font-size: 18px; color: var(--brand); }
  .card p { margin: 0; color: var(--on-surface-2); font-size: 14px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="container">
    <h1>MakeMeAPlan</h1>
    <p class="subtitle">Legal information for the MakeMeAPlan mobile app.</p>

    <a class="card" href="privacy.html">
      <h2>Privacy Policy</h2>
      <p>How we handle your data.</p>
    </a>

    <a class="card" href="terms.html">
      <h2>Terms of Service</h2>
      <p>Rules for using the app.</p>
    </a>

    <footer>
      Contact: <a href="mailto:makemeaplan.help@gmail.com">makemeaplan.help@gmail.com</a>
    </footer>
  </div>
</body>
</html>
